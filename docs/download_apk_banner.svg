<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 120" width="780" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="778" height="118" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Android Icon Badge -->
  <g transform="translate(25, 24)">
    <circle cx="36" cy="36" r="34" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>
    
    <!-- Android Mascot Icon (Green) -->
    <g transform="translate(18, 18) scale(1.5)" fill="#10B981">
      <!-- Head -->
      <path d="M5 9 C5 5.5 8 2.5 12 2.5 C16 2.5 19 5.5 19 9 Z"/>
      <!-- Eyes -->
      <circle cx="8.5" cy="6.5" r="0.9" fill="#0F172A"/>
      <circle cx="15.5" cy="6.5" r="0.9" fill="#0F172A"/>
      <!-- Antennae -->
      <line x1="7" y1="3" x2="5" y2="0.8" stroke="#10B981" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="17" y1="3" x2="19" y2="0.8" stroke="#10B981" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Body -->
      <path d="M5 10.5 H19 V19 C19 20 18 21 17 21 H7 C6 21 5 20 5 19 Z"/>
      <!-- Arms -->
      <rect x="2.5" y="10.5" width="1.5" height="7" rx="0.75"/>
      <rect x="20" y="10.5" width="1.5" height="7" rx="0.75"/>
      <!-- Legs -->
      <rect x="8" y="21" width="2" height="4" rx="1"/>
      <rect x="14" y="21" width="2" height="4" rx="1"/>
    </g>
  </g>

  <!-- Text Hierarchy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Subtitle Pill -->
    <text x="115" y="38" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.5">OFFICIAL PRODUCTION BUILD</text>
    
    <!-- Main Title -->
    <text x="115" y="65" font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">Attendance Tracker &amp; Campus GIS</text>
    
    <!-- Description / Specs -->
    <text x="115" y="88" font-size="12" font-weight="400" fill="#94A3B8">
      Universal Android APK (v1.0.0) • Offline-First Sync • Sub-2ms Vector Routing
    </text>
  </g>

  <!-- Right Download CTA Button -->
  <g transform="translate(540, 31)">
    <!-- Button Shape with Shadow -->
    <rect x="0" y="0" width="215" height="58" rx="14" fill="url(#btnGrad)" filter="url(#btnShadow)"/>
    <rect x="0" y="0" width="215" height="58" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Download Icon (Left inside button) -->
    <g transform="translate(18, 16)">
      <circle cx="13" cy="13" r="13" fill="#FFFFFF" fill-opacity="0.2"/>
      <!-- Arrow Icon -->
      <path d="M13 7 V17 M9 13 L13 17 L17 13 M8 20 H18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Button Text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="54" y="26" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1">DOWNLOAD APK</text>
      <text x="54" y="42" font-size="10.5" font-weight="500" fill="#E2E8F0" fill-opacity="0.9">Direct Install • Android 9+</text>
    </g>
  </g>
</svg>
